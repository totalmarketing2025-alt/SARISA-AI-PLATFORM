name: SARISA Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "sarisa-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sarisa-windows-zip
          path: sarisa-windows.zip
          if-no-files-found: error
