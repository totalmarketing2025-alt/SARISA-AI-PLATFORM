name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android,windows .

      - name: Configure Android internet and foreground location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in content:
                  marker = "<application"
                  if marker not in content:
                      raise SystemExit("ERROR: Android application tag not found")
                  content = content.replace(
                      marker,
                      tag + "\n    " + marker,
                      1,
                  )

          if "<application" not in content:
              raise SystemExit("ERROR: Android application tag not found")

          manifest.write_text(content)
          print("Android internet and foreground GPS permissions configured.")
          PY

      - run: flutter pub get

      - name: Set all Android modules to compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("android"),
              Path.home() / ".pub-cache/hosted/pub.dev",
          ]

          pattern = re.compile(
              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)'
              r'(?:flutter\.compileSdkVersion|\d+)'
              r'(\s*(?://.*)?)$'
          )

          changed = 0

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("build.gradle*"):
                  if path.name not in ("build.gradle", "build.gradle.kts"):
                      continue

                  content = path.read_text()
                  updated, count = pattern.subn(
                      lambda m: m.group(1) + "36" + m.group(2),
                      content
                  )

                  if count:
                      path.write_text(updated)
                      print(f"Updated: {path}")
                      changed += count

          if changed == 0:
              raise SystemExit("ERROR: No compileSdk settings were updated")

          print(f"Total updated settings: {changed}")
          PY

      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sarisa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
