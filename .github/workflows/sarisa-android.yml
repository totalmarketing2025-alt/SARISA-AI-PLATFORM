name: SARISA Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing android platform project
        run: flutter create --platforms=android --project-name sarisa .
      - name: Install Android SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Set compileSdk 36 for generated Android and plugin modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")
          if not app.exists():
              raise SystemExit("Generated Android app Gradle file missing")
          source = app.read_text()
          import re
          source, count = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', source)
          if count == 0:
              source, count = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', source)
          if count == 0:
              raise SystemExit("Unable to locate app compileSdk setting")
          app.write_text(source)
          root = Path("android/build.gradle.kts")
          if root.exists():
              root.write_text(root.read_text() + """
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          """)
          else:
              root = Path("android/build.gradle")
              if not root.exists():
                  raise SystemExit("Android root Gradle file missing")
              root.write_text(root.read_text() + """
          subprojects { subproject ->
              subproject.plugins.withId('com.android.library') {
                  subproject.android.compileSdkVersion 36
              }
          }
          """)
          print("Android app and library modules configured for compileSdk 36")
          PY
      - name: Flutter dependencies
        run: flutter pub get
      - name: Enforce compileSdk 36 in file_picker plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          matches = list(cache.glob("file_picker-*/android/build.gradle")) + list(cache.glob("file_picker-*/android/build.gradle.kts"))
          if not matches:
              raise SystemExit("file_picker Android Gradle file not found")
          for path in matches:
              source = path.read_text()
              updated = source
              updated = re.sub(r'compileSdkVersion\\s*(?:=\\s*)?(?:flutter\\.compileSdkVersion|\\d+)', 'compileSdkVersion 36', updated)
              updated = re.sub(r'compileSdk\\s*=\\s*(?:flutter\\.compileSdkVersion|\\d+)', 'compileSdk = 36', updated)
              if updated == source:
                  raise SystemExit(f"compileSdk declaration not found in {path}")
              path.write_text(updated)
              print(f"Set compileSdk 36 in {path}")
          PY
      - name: Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sarisa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
