name: SARISA Build Android + Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: sarisa-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing android platform project
        run: flutter create --platforms=android --project-name sarisa .
      - name: Generate SARISA Android app icon
        run: |
          python3 -m pip install Pillow
          python3 tool/generate_brand_icons.py --platform android
      - name: Configure Android camera permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in source:
              source = source.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(source)
          print("Android camera permission configured")
          PY
      - name: Install Android SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Set compileSdk 36 for generated Android and plugin modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")
          if not app.exists():
              raise SystemExit("Generated Android app Gradle file missing")
          source = app.read_text()
          import re
          source, count = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', source)
          if count == 0:
              source, count = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', source)
          if count == 0:
              raise SystemExit("Unable to locate app compileSdk setting")
          app.write_text(source)
          root = Path("android/build.gradle.kts")
          if root.exists():
              root.write_text(root.read_text() + """
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          """)
          else:
              root = Path("android/build.gradle")
              if not root.exists():
                  raise SystemExit("Android root Gradle file missing")
              root.write_text(root.read_text() + """
          subprojects { subproject ->
              subproject.plugins.withId('com.android.library') {
                  subproject.android.compileSdkVersion 36
              }
          }
          """)
          print("Android app and library modules configured for compileSdk 36")
          PY
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sarisa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Windows platform project
        run: flutter create --platforms=windows --project-name sarisa .
      - name: Generate SARISA Windows app icon
        run: |
          python -m pip install Pillow
          python tool/generate_brand_icons.py --platform windows
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "sarisa-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sarisa-windows-zip
          path: sarisa-windows.zip
          if-no-files-found: error
